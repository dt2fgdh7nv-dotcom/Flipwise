# Local PostgreSQL for development. Production uses a managed EU-region Postgres (Supabase/Neon).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flipwise
      POSTGRES_PASSWORD: flipwise
      POSTGRES_DB: flipwise
    ports:
      - "5432:5432"
    volumes:
      - flipwise-db:/var/lib/postgresql/data
volumes:
  flipwise-db:
